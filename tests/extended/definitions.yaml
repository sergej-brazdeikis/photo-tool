functional_groups:
  - id: epic1_foundation
    parallel_group: epic-1
    command: go test ./internal/config ./internal/store ./internal/exifmeta ./internal/filehash ./internal/paths ./internal/ingest -count=1
  - id: epic1_cli
    parallel_group: epic-1
    command: go test ./internal/cli ./tests/e2e -count=1
