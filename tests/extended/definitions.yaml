    parallel_group: epic-1
    command: go test ./internal/app -run 'Upload|Drop|FR06|UX_upload' -count=1
  - id: epic2_review
    parallel_group: epic-2
    command: go test ./internal/app -run 'Review|Rejected|Collection|Story210|Story212' -count=1
