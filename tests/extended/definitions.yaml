# Extended testing matrix row definitions (see tests/extended/matrix_gen.go).

functional_groups:
  - id: epic1_foundation
    parallel_group: epic-1
    command: go test ./internal/config ./internal/store ./internal/exifmeta ./internal/filehash ./internal/paths ./internal/ingest -count=1
  - id: epic1_cli
    parallel_group: epic-1
    command: go test ./internal/cli ./tests/e2e -count=1
  - id: epic1_upload
    parallel_group: epic-1
    command: go test ./internal/app -run 'Upload|Drop|FR06|UX_upload' -count=1
  - id: epic2_review
    parallel_group: epic-2
    command: go test ./internal/app -run 'Review|Rejected|Collection|Story210|Story212' -count=1
  - id: epic2_layout
    parallel_group: epic-2
    command: go test ./internal/app -run 'NFR01|E2E_shell|ux_layout|UXDR' -count=1
  - id: epic3_share
    parallel_group: epic-3
    command: go test ./internal/share -count=1
  - id: epic4_packages
    parallel_group: epic-4
    command: go test ./internal/app -run 'Package|Share' ./internal/share -run 'Package|MintPackage' -count=1
  - id: root_ci
    parallel_group: root
    command: go test -tags ci ./... -count=1

