    parallel_group: epic-3
    command: go test ./internal/share -count=1
  - id: epic4_packages
    parallel_group: epic-4
    command: go test ./internal/app -run 'Package|Share' ./internal/share -run 'Package|MintPackage' -count=1
  - id: root_ci
    parallel_group: root
    command: go test -tags ci ./... -count=1

